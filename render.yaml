# Use this Blueprint to deploy n8n on Render as a web service
# that uses an EXTERNAL Supabase PostgreSQL database to store
# workflow data (instead of a Render-managed Postgres instance).
#
# WHY Supabase: the Render free Postgres expires after 30 days.
#
# IMPORTANT — IPv6 / ENETUNREACH fix:
#   Supabase's direct host (db.<ref>.supabase.co) publishes an IPv6
#   (AAAA) record, but Render instances have NO IPv6 egress. That made
#   n8n crash with: `connect ENETUNREACH <ipv6>:5432`.
#   NODE_OPTIONS below forces Node to prefer the IPv4 address. Keep it.

services:
  - type: web
    plan: free
    runtime: image
    name: n8n-service
    image:
      url: docker.io/n8nio/n8n:latest

    envVars:
      # --- IPv4 fix for the Supabase direct host (do not remove) ---
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first

      # Auto-generated encryption key. DO NOT change after first deploy,
      # or you lose access to previously encrypted credentials.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # --- Database: Supabase via SESSION POOLER (IPv4, Render-safe) ---
      # The Supabase DIRECT host (db.<ref>.supabase.co) is IPv6-only by
      # default and Render has no IPv6 egress (=> ENETUNREACH). The
      # Supavisor Session pooler is IPv4-proxied for free. Do NOT use the
      # transaction pooler (port 6543): it breaks n8n/TypeORM statements.
      - key: DB_TYPE
        value: postgresdb

      - key: DB_POSTGRESDB_HOST
        value: aws-0-eu-west-1.pooler.supabase.com

      - key: DB_POSTGRESDB_PORT
        value: "5432"

      # Supabase default database name is "postgres"; the pooler requires
      # the username to be suffixed with the project ref.
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_USER
        value: postgres.zlhrprheolrfvmemrhse

      # Supabase requires SSL.
      - key: DB_POSTGRESDB_SSL
        value: "true"

      # The password already exists on the deployed service. `sync: false`
      # tells Render to KEEP the current value and NOT manage it from this
      # file, so the secret is never committed to the public repo.
      - key: DB_POSTGRESDB_PASSWORD
        sync: false

      # Webhooks base URL (real Render service URL).
      - key: WEBHOOK_URL
        value: https://n8n-service-2wje.onrender.com/

# No Render-managed database anymore: n8n now points at Supabase.
# (Removing this also frees your workspace's single free-DB slot.)
